{% extends "base.html" %}
{% block title %}Crear cuenta — EduDigital{% endblock %}

{% block content %}
<div class="card">
    <h1>Crear cuenta</h1>
    <form method="POST">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required minlength="6">

        <label for="rol">Tipo de cuenta</label>
        <select id="rol" name="rol">
            <option value="estudiante">Estudiante</option>
            <option value="docente">Docente</option>
        </select>

        <div id="campo-codigo" style="display:none;">
            <label for="codigo_docente">Código de docente</label>
            <input type="text" id="codigo_docente" name="codigo_docente" autocomplete="off">
        </div>

        <button type="submit">Crear cuenta</button>
    </form>
    <p style="margin-top:16px;">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
</div>
<script>
    var rol = document.getElementById('rol');
    function mostrarCodigo() {
        document.getElementById('campo-codigo').style.display = rol.value === 'docente' ? 'block' : 'none';
    }
    rol.addEventListener('change', mostrarCodigo);
    mostrarCodigo();
</script>
{% endblock %}
